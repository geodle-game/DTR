<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drawn to Ruin — Multiplayer Test</title>
  <link rel="stylesheet" href="./styles/base.css" />
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(ellipse at top, #1c1f27 0%, #14161a 60%);
      color: #e8eaee;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
    }
    #mp-root {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .mp-frame {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .mp-title {
      margin: 0;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      letter-spacing: .12em;
      color: #ffd166;
      text-shadow: 0 0 24px rgba(255,209,102,.5);
    }
    .mp-subtitle {
      margin: -12px 0 0;
      text-align: center;
      color: #8b93a1;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .mp-card {
      background: linear-gradient(180deg, #232833, #1a1e26);
      border: 1px solid #3a4250;
      border-radius: 14px;
      padding: 20px 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
    }
    .mp-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .mp-col {
      flex: 1;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .mp-col h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #c9a3ff;
      font-weight: 600;
    }
    .mp-col p {
      margin: 0;
      font-size: 13px;
      color: #b8bdc7;
      line-height: 1.5;
    }
    .mp-btn {
      background: linear-gradient(180deg, #9d7cff, #7a55ff);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(143,107,255,.35);
      font-family: inherit;
      transition: transform .08s ease, filter .08s ease;
      letter-spacing: .04em;
    }
    .mp-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .mp-btn:active { transform: translateY(1px); }
    .mp-btn:disabled {
      background: #262b34;
      color: #8b93a1;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .mp-btn.secondary {
      background: linear-gradient(180deg, #2a2f3a, #1e2229);
      border: 1px solid #4a5262;
      color: #c9a3ff;
      box-shadow: 0 4px 14px rgba(0,0,0,.4);
    }
    .mp-btn.danger {
      background: linear-gradient(180deg, #c05050, #903030);
      box-shadow: 0 4px 14px rgba(200,80,80,.35);
    }
    .mp-input {
      background: #14161a;
      border: 1px solid #3a4250;
      color: #e8eaee;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 18px;
      font-family: monospace;
      letter-spacing: .3em;
      text-align: center;
      text-transform: uppercase;
      width: 100%;
      box-sizing: border-box;
    }
    .mp-input:focus {
      outline: none;
      border-color: #8f6bff;
      box-shadow: 0 0 0 3px rgba(143,107,255,.25);
    }
    .mp-status {
      text-align: center;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(0,0,0,.35);
      border: 1px solid #2a2f3a;
      color: #b8bdc7;
      letter-spacing: .04em;
    }
    .mp-status.error {
      color: #ff8a8a;
      border-color: #6a3030;
      background: rgba(80,30,30,.35);
    }
    .mp-status.ok {
      color: #6bff9e;
      border-color: #3a6a4a;
      background: rgba(30,80,40,.35);
    }
    .mp-code {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: rgba(143,107,255,.1);
      border: 2px solid #8f6bff;
      border-radius: 12px;
      font-family: monospace;
      font-size: 36px;
      letter-spacing: .4em;
      color: #ffd166;
      text-shadow: 0 0 24px rgba(255,209,102,.6);
      font-weight: 800;
    }
    .mp-code-copy {
      padding: 6px 12px;
      font-size: 12px;
      letter-spacing: .06em;
      border-radius: 6px;
      background: #2a2438;
      color: #c9a3ff;
      border: 1px solid #4a3a6a;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }
    .mp-code-copy:hover { background: #3a3058; }

    /* ---------- Game view ---------- */
    .mp-game {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .mp-game-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .mp-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .mp-badge.host {
      background: rgba(143,107,255,.2);
      border: 1px solid #8f6bff;
      color: #c9a3ff;
    }
    .mp-badge.joiner {
      background: rgba(107,255,158,.15);
      border: 1px solid #6bff9e;
      color: #6bff9e;
    }
    .mp-badge.disconnected {
      background: rgba(200,80,80,.2);
      border: 1px solid #c05050;
      color: #ff8a8a;
    }
    .mp-enemy {
      background: linear-gradient(180deg, #3a1f1f, #241414);
      border: 2px solid #8a4040;
      border-radius: 14px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .mp-enemy-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .06em;
      color: #ff9b6b;
      text-transform: uppercase;
    }
    .mp-hp-bar {
      height: 26px;
      background: #14161a;
      border: 1px solid #3a4250;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    .mp-hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #e05c5c, #ff8a6b);
      transition: width .4s ease;
      box-shadow: 0 0 20px rgba(224,92,92,.5) inset;
    }
    .mp-hp-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      text-shadow: 0 2px 4px rgba(0,0,0,.9);
      letter-spacing: .06em;
    }
    .mp-stats {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 16px;
      background: linear-gradient(180deg, #232833, #1a1e26);
      border: 1px solid #3a4250;
      border-radius: 12px;
    }
    .mp-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 90px;
    }
    .mp-stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #8b93a1;
    }
    .mp-stat-value {
      font-size: 22px;
      font-weight: 800;
      color: #c9a3ff;
      letter-spacing: .02em;
    }
    .mp-stat-value.gold { color: #ffd166; }
    .mp-stat-value.green { color: #6bff9e; }
    .mp-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .mp-controls .mp-btn {
      min-width: 160px;
      padding: 14px 20px;
      font-size: 15px;
    }
    .mp-log {
      background: rgba(0,0,0,.35);
      border: 1px solid #2a2f3a;
      border-radius: 10px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.7;
      color: #b8bdc7;
      max-height: 180px;
      overflow-y: auto;
    }
    .mp-log-line { opacity: .8; }
    .mp-log-line.recent { opacity: 1; color: #c9a3ff; }
    .mp-log-line.host { color: #c9a3ff; }
    .mp-log-line.joiner { color: #6bff9e; }
    .mp-waiting {
      text-align: center;
      padding: 12px;
      font-size: 13px;
      letter-spacing: .06em;
      color: #ffd166;
      animation: mpPulse 1.6s ease-in-out infinite;
    }
    @keyframes mpPulse {
      0%, 100% { opacity: .55; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="mp-root"></div>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="./multiplayer.js"></script>
</body>
</html>
