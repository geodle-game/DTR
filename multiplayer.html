<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drawn to Ruin — Manual Multiplayer</title>
  <link rel="stylesheet" href="./styles/base.css" />
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(ellipse at top, #1c1f27 0%, #14161a 60%);
      color: #e8eaee;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      -webkit-text-size-adjust: 100%;
    }
    #mp-root {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px;
    }
    .mp-frame {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .mp-title {
      margin: 0;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      letter-spacing: .12em;
      color: #ffd166;
      text-shadow: 0 0 24px rgba(255,209,102,.5);
    }
    .mp-subtitle {
      margin: -10px 0 0;
      text-align: center;
      color: #8b93a1;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .mp-card {
      background: linear-gradient(180deg, #232833, #1a1e26);
      border: 1px solid #3a4250;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
    }
    .mp-card h2 {
      margin: 0 0 12px;
      font-size: 13px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #c9a3ff;
      font-weight: 600;
    }
    .mp-card p {
      margin: 0 0 12px;
      font-size: 13px;
      color: #b8bdc7;
      line-height: 1.55;
    }
    .mp-btn {
      background: linear-gradient(180deg, #9d7cff, #7a55ff);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 20px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(143,107,255,.35);
      font-family: inherit;
      transition: transform .08s ease, filter .08s ease;
      letter-spacing: .04em;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
      margin-top: 6px;
    }
    .mp-btn:hover { filter: brightness(1.08); }
    .mp-btn:active { transform: translateY(1px); }
    .mp-btn:disabled {
      background: #262b34;
      color: #8b93a1;
      cursor: not-allowed;
      box-shadow: none;
    }
    .mp-btn.secondary {
      background: linear-gradient(180deg, #2a2f3a, #1e2229);
      border: 1px solid #4a5262;
      color: #c9a3ff;
      box-shadow: 0 4px 14px rgba(0,0,0,.4);
    }
    .mp-btn.danger {
      background: linear-gradient(180deg, #a04040, #803030);
      box-shadow: 0 4px 14px rgba(160,60,60,.35);
    }
    .mp-choice {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .mp-textarea {
      width: 100%;
      min-height: 140px;
      box-sizing: border-box;
      background: #0e0f13;
      border: 1px solid #3a4250;
      border-radius: 10px;
      color: #c8cdd7;
      padding: 12px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      line-height: 1.45;
      resize: vertical;
      word-break: break-all;
      -webkit-appearance: none;
    }
    .mp-textarea:focus {
      outline: none;
      border-color: #8f6bff;
      box-shadow: 0 0 0 3px rgba(143,107,255,.25);
    }
    .mp-status {
      text-align: center;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(0,0,0,.35);
      border: 1px solid #2a2f3a;
      color: #b8bdc7;
      letter-spacing: .04em;
      margin-top: 12px;
    }
    .mp-status.error { color: #ff8a8a; border-color: #6a3030; background: rgba(80,30,30,.35); }
    .mp-status.ok    { color: #6bff9e; border-color: #3a6a4a; background: rgba(30,80,40,.35); }
    .mp-status.wait  { color: #ffd166; border-color: #4a3a2a; background: rgba(80,60,30,.35); }

    .mp-step {
      border: 1px solid #3a4250;
      background: rgba(0,0,0,.25);
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
    }
    .mp-step.active {
      border-color: #8f6bff;
      box-shadow: 0 0 0 3px rgba(143,107,255,.2);
    }
    .mp-step.done {
      border-color: #3a6a4a;
      opacity: .7;
    }
    .mp-step-title {
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #c9a3ff;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mp-step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #4a3a6a;
      color: #ffd166;
      font-size: 12px;
      font-weight: 800;
      margin-right: 8px;
    }
    .mp-step.done .mp-step-num { background: #3a6a4a; color: #6bff9e; }
    .mp-step-body {
      font-size: 12px;
      color: #b8bdc7;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .mp-mini-btn {
      background: #2a2438;
      color: #c9a3ff;
      border: 1px solid #4a3a6a;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .mp-mini-btn:hover { background: #3a3058; }
    .mp-log {
      background: rgba(0,0,0,.5);
      border: 1px solid #2a2f3a;
      border-radius: 10px;
      padding: 12px 14px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      line-height: 1.6;
      color: #b8bdc7;
      max-height: 240px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 12px;
    }
    .mp-log-line { opacity: .85; word-break: break-word; }
    .mp-log-line.ok { color: #6bff9e; }
    .mp-log-line.err { color: #ff8a8a; }
    .mp-log-line.warn { color: #ffd166; }

    .mp-game { display: flex; flex-direction: column; gap: 14px; }
    .mp-game-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .mp-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .mp-badge.host { background: rgba(143,107,255,.2); border: 1px solid #8f6bff; color: #c9a3ff; }
    .mp-badge.joiner { background: rgba(107,255,158,.15); border: 1px solid #6bff9e; color: #6bff9e; }
    .mp-badge.disconnected { background: rgba(200,80,80,.2); border: 1px solid #c05050; color: #ff8a8a; }

    .mp-enemy {
      background: linear-gradient(180deg, #3a1f1f, #241414);
      border: 2px solid #8a4040;
      border-radius: 14px;
      padding: 18px 20px;
    }
    .mp-enemy-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .06em;
      color: #ff9b6b;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .mp-hp-bar {
      height: 26px;
      background: #14161a;
      border: 1px solid #3a4250;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    .mp-hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #e05c5c, #ff8a6b);
      transition: width .4s ease;
    }
    .mp-hp-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      text-shadow: 0 2px 4px rgba(0,0,0,.9);
      letter-spacing: .06em;
    }
    .mp-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 10px;
      padding: 14px;
      background: linear-gradient(180deg, #232833, #1a1e26);
      border: 1px solid #3a4250;
      border-radius: 12px;
    }
    .mp-stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .mp-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: #8b93a1; }
    .mp-stat-value { font-size: 20px; font-weight: 800; color: #c9a3ff; }
    .mp-stat-value.gold { color: #ffd166; }
    .mp-stat-value.green { color: #6bff9e; }
    .mp-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .mp-waiting {
      text-align: center;
      padding: 10px;
      font-size: 13px;
      letter-spacing: .06em;
      color: #ffd166;
      animation: mpPulse 1.6s ease-in-out infinite;
    }
    @keyframes mpPulse {
      0%, 100% { opacity: .55; }
      50% { opacity: 1; }
    }
    @media (max-width: 600px) {
      .mp-title { font-size: 22px; }
      .mp-choice { grid-template-columns: 1fr; }
      .mp-controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="mp-root"></div>
  <script type="module" src="./multiplayer.js"></script>
</body>
</html>
